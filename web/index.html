<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#16181d" />
    <!-- Sets data-theme before first paint. Must equal themeInitScript() from kore-ui (src/theme.test.ts checks it). -->
    <script>(function(){try{var p=localStorage.getItem("kore-theme")||"color";var t=p;if(p==="system"){t=matchMedia("(prefers-color-scheme: light)").matches?"light":"color"}if(t!=="light"&&t!=="dark"&&t!=="color")t="color";document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","color")}})()</script>
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Kore ID</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Kore ID needs JavaScript. Turn it on and reload the page.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
